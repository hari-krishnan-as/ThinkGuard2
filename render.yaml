services:
  # Backend Service
  - type: web
    name: thinkguard-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: thinkguard-frontend
    runtime: static
    plan: free
    buildCommand: cd client && chmod +x build-static.sh && ./build-static.sh
    staticPublishPath: client/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://thinkguard1.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://thinkguard1.onrender.com
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /register
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /chat
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /dashboard
        destination: /index.html
